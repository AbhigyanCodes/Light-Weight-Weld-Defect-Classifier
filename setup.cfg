[metadata]
name = Light-Weight-Weld-Defect-Classifier
version = 0.1.0
description = Lightweight ML for real-time weld defect detection
author = AbhigyanCodes

[options]
packages = find:
package_dir =
    = src
install_requires =
    numpy>=1.23
    pandas>=1.4
    scikit-learn>=1.1
    opencv-python>=4.6
    scikit-image>=0.19
    matplotlib>=3.5
    seaborn>=0.12
    tensorflow>=2.10
    joblib>=1.2
    tqdm>=4.64

[options.packages.find]
where = src
